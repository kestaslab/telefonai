<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 68 496 254" width="100%" height="100%" fill="none">
  <!-- Tryškių Lazdynų Pelėdos gimnazija Official Emblem SVG (Optimized tight bounds) -->
  <!-- Ground base line -->
  <rect x="22" y="304" width="488" height="14" fill="#0f172a" rx="2" />

  <!-- Left building body outline -->
  <rect x="30" y="180" width="225" height="124" fill="#ffffff" stroke="#0f172a" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Left building roof (gable on left, sloping ridge towards tower) -->
  <polygon points="25,180 55,148 245,160 245,180" fill="#1e293b" stroke="#0f172a" stroke-width="6" stroke-linejoin="round" />
  <polygon points="25,180 55,148 55,180" fill="#0f172a" />

  <!-- 3 Groups of Windows (Group 1: x=46, Group 2: x=115, Group 3: x=184) -->
  <!-- Group 1 -->
  <rect x="46" y="196" width="12" height="26" fill="#0f172a" />
  <rect x="62" y="196" width="12" height="26" fill="#0f172a" />
  <rect x="78" y="196" width="12" height="26" fill="#0f172a" />
  <rect x="46" y="228" width="12" height="26" fill="#0f172a" />
  <rect x="62" y="228" width="12" height="26" fill="#0f172a" />
  <rect x="78" y="228" width="12" height="26" fill="#0f172a" />

  <!-- Group 2 -->
  <rect x="114" y="196" width="12" height="26" fill="#0f172a" />
  <rect x="130" y="196" width="12" height="26" fill="#0f172a" />
  <rect x="146" y="196" width="12" height="26" fill="#0f172a" />
  <rect x="114" y="228" width="12" height="26" fill="#0f172a" />
  <rect x="130" y="228" width="12" height="26" fill="#0f172a" />
  <rect x="146" y="228" width="12" height="26" fill="#0f172a" />

  <!-- Group 3 -->
  <rect x="182" y="196" width="12" height="26" fill="#0f172a" />
  <rect x="198" y="196" width="12" height="26" fill="#0f172a" />
  <rect x="214" y="196" width="12" height="26" fill="#0f172a" />
  <rect x="182" y="228" width="12" height="26" fill="#0f172a" />
  <rect x="198" y="228" width="12" height="26" fill="#0f172a" />
  <rect x="214" y="228" width="12" height="26" fill="#0f172a" />

  <!-- Text on building wall -->
  <text x="138" y="274" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="12" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">TRYŠKIŲ LAZDYNŲ PELĖDOS</text>
  <text x="138" y="291" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="11" fill="#0f172a" text-anchor="middle" letter-spacing="0.8">GIMNAZIJA</text>

  <!-- Right Decorative Sunburst / Fan Arch -->
  <!-- Outer Arch Border -->
  <path d="M 315 304 A 180 180 0 0 1 495 304" fill="none" stroke="#0f172a" stroke-width="9" stroke-linecap="round" />
  <path d="M 315 304 A 168 168 0 0 1 483 304" fill="none" stroke="#0f172a" stroke-width="4" />
  
  <!-- Fan Hub (solid quarter circle at center) -->
  <path d="M 315 304 L 350 304 A 35 35 0 0 0 315 269 Z" fill="#0f172a" />

  <!-- Fan Radiating Slats / Spokes -->
  <!-- Radiating lines from hub (315, 304) towards the outer arc with radius 168 -->
  <line x1="340" y1="284" x2="435" y2="188" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
  <line x1="348" y1="293" x2="460" y2="228" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
  <line x1="349" y1="300" x2="478" y2="268" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
  <line x1="330" y1="275" x2="400" y2="160" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
  <line x1="322" y1="271" x2="362" y2="145" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
  <line x1="316" y1="269" x2="322" y2="140" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
  
  <!-- Additional dense fan slats matching original -->
  <line x1="326" y1="273" x2="380" y2="151" stroke="#0f172a" stroke-width="3.5" />
  <line x1="335" y1="279" x2="418" y2="173" stroke="#0f172a" stroke-width="3.5" />
  <line x1="344" y1="288" x2="448" y2="207" stroke="#0f172a" stroke-width="3.5" />
  <line x1="348" y1="296" x2="471" y2="248" stroke="#0f172a" stroke-width="3.5" />
  <line x1="350" y1="302" x2="480" y2="288" stroke="#0f172a" stroke-width="3.5" />

  <!-- Center Tower Structure -->
  <!-- Tower Body -->
  <rect x="250" y="125" width="65" height="179" fill="#ffffff" stroke="#0f172a" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Tower Roof (Triangle Gable) -->
  <polygon points="242,130 282,75 322,130" fill="#1e293b" stroke="#0f172a" stroke-width="7" stroke-linejoin="round" />

  <!-- Tower Stacked Windows (6 vertical windows) -->
  <rect x="272" y="146" width="21" height="16" fill="#0f172a" />
  <rect x="272" y="169" width="21" height="16" fill="#0f172a" />
  <rect x="272" y="192" width="21" height="16" fill="#0f172a" />
  <rect x="272" y="215" width="21" height="16" fill="#0f172a" />
  <rect x="272" y="238" width="21" height="16" fill="#0f172a" />
  <rect x="272" y="261" width="21" height="16" fill="#0f172a" />

  <!-- Entrance Portico at base of tower -->
  <rect x="245" y="280" width="75" height="28" fill="#ffffff" stroke="#0f172a" stroke-width="7" stroke-linejoin="round" />
  <!-- 4 Pillars / 3 Portals -->
  <rect x="254" y="287" width="8" height="21" fill="#0f172a" />
  <rect x="270" y="287" width="8" height="21" fill="#0f172a" />
  <rect x="287" y="287" width="8" height="21" fill="#0f172a" />
  <rect x="303" y="287" width="8" height="21" fill="#0f172a" />
</svg>
